server {
 listen 8443 ssl;
 server_name 127.0.0.1;
 ssl_certificate /tls/tls.crt;
 ssl_certificate_key /tls/tls.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /usr/share/nginx/html;
 index index.html;
 charset utf-8;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control $azp_web_cache_control always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'sha256-yoc0aUZqNwefwPjFmePIRXEltOWxjOffinMaGSQf8wk=' 'sha256-+9V2eObsP+Ml00hFZgqE1YykMqXDdfqtzXW2b+WGVnI=' 'sha256-V7IzGbxdHlWMdRAK376En1HuJF4L3YzB80htz5mLZ18=' 'sha256-qjGtOE0AhcPje5BI6HqVNlp8MeKnbemDL8aJCv4goFY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://127.0.0.1:29457 https://api.drand.sh; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
 location = /favicon.ico { return 204; }
 location = /health { access_log off; return 200 'ok'; }
 location = /ws {
  proxy_pass http://app-api:8888;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 90s;
  proxy_send_timeout 90s;
  proxy_buffering off;
 }
 location ~ ^/(auth|v1|api/v1|admin|health)/ {
  proxy_pass http://app-api:8888;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Request-Id $http_x_request_id;
  proxy_read_timeout 15s;
 }
 location /game/ { include /etc/nginx/static-gzip.conf; try_files $uri $uri/ =404; }
 location /assets/ { include /etc/nginx/static-gzip.conf; try_files $uri =404; }
 location / { include /etc/nginx/static-gzip.conf; try_files $uri $uri/ /index.html; }
}
