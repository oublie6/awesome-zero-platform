apiVersion: v1
kind: Service
metadata:
  name: beanstalkd-a
  namespace: awesome-zero-game-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beanstalkd-a
  ports:
    - name: queue
      port: 11300
      targetPort: queue
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: beanstalkd-a
  namespace: awesome-zero-game-test
spec:
  serviceName: beanstalkd-a
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: beanstalkd-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beanstalkd-a
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beanstalkd
          # Must be changed to a BUILT, VERIFIED immutable digest before apply.
          image: ghcr.io/oublie6/awesome-zero-platform/beanstalkd:goal0063-UNBUILT
          imagePullPolicy: IfNotPresent
          ports:
            - name: queue
              containerPort: 11300
          volumeMounts:
            - name: journal
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: queue
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: queue
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: journal
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
