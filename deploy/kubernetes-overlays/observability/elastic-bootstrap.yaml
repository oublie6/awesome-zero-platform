# Idempotent setup for the application-only 7-day index lifecycle.
apiVersion: batch/v1
kind: Job
metadata:
  name: elastic-bootstrap
  namespace: awesome-zero-platform
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: curlimages/curl:8.11.1
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until curl -fsS http://elasticsearch:9200/_cluster/health >/dev/null; do sleep 3; done
              curl -fsS -XPUT http://elasticsearch:9200/_ilm/policy/awesome-logs-seven-days \
                -H 'Content-Type: application/json' \
                -d '{"policy":{"phases":{"delete":{"min_age":"7d","actions":{"delete":{}}}}}}'
              curl -fsS -XPUT http://elasticsearch:9200/_index_template/awesome-logs \
                -H 'Content-Type: application/json' \
                -d '{"index_patterns":["awesome-logs-*"],"template":{"settings":{"index.lifecycle.name":"awesome-logs-seven-days","number_of_shards":1,"number_of_replicas":0}},"priority":300}'
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
