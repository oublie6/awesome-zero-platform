# Single-node, unauthenticated Elasticsearch for a private DEVELOPMENT cluster only.
# Never expose Elasticsearch outside the cluster. Requires vm.max_map_count >= 1048576.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: awesome-zero-platform
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: awesome-zero-platform
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: ES_SETTING_DISCOVERY_TYPE
              value: single-node
            - name: ES_SETTING_XPACK_SECURITY_ENABLED
              value: "false"
            - name: ES_SETTING_XPACK_ML_ENABLED
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 20
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 36
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
