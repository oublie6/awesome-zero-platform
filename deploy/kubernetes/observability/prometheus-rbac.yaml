apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-prometheus
  namespace: awesome-zero-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-prometheus-pods
  namespace: awesome-zero-platform
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-prometheus-pods
  namespace: awesome-zero-platform
subjects:
  - kind: ServiceAccount
    name: observability-prometheus
    namespace: awesome-zero-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-prometheus-pods
