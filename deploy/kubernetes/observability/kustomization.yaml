apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awesome-zero-platform

resources:
  - ../base.yaml
  - elasticsearch.yaml
  - elastic-bootstrap.yaml
  - kibana.yaml
  - prometheus.yaml
  - prometheus-rbac.yaml
  - grafana.yaml
  - jaeger.yaml

patches:
  - path: patch-app-api.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: obs-filebeat
    files:
      - filebeat.yml
  - name: obs-prometheus
    files:
      - prometheus.yml
  - name: obs-grafana-datasources
    files:
      - datasources.yml=grafana-datasources.yml
  - name: obs-grafana-providers
    files:
      - dashboards.yml=grafana-provider.yml
  - name: obs-grafana-dashboard
    files:
      - platform-overview.json
