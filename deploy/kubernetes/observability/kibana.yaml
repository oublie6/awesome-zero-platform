apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: awesome-zero-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: awesome-zero-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: TELEMETRY_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1200Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 15
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 50
