# Dedicated API application JSON files only. No Docker socket/host-wide mounts.
filebeat.inputs:
  - type: filestream
    id: awesome-app-json
    enabled: true
    paths:
      - /var/log/awesome/*.log
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: false
    fields:
      serviceName: app-api
    fields_under_root: true

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "awesome-logs-%{+yyyy.MM.dd}"

logging.level: info
