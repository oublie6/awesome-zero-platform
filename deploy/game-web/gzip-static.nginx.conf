# Include only in public static locations such as /game/ and /assets/.
# Do not include in http{}, server{}, or API/auth/WebSocket proxy locations.
# Decompressed content and existing cache/security headers remain unchanged.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types application/javascript text/css application/json;
