# Include only in public static locations such as /game/, /assets/, and static /.
# Do not include in http{}, server{}, or API/auth/WebSocket proxy locations.
# Decompressed content and existing cache/security headers remain unchanged.
gzip_static on;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types application/javascript application/json application/wasm text/javascript text/css text/plain image/svg+xml;
