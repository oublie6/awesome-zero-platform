# Goal0065: STATIC-WEB-ONLY nginx HTTP-cache contract.
# Include this file once inside nginx http{} context (map is not valid in server{}).
# In the existing static Web server{} add:
#   add_header Cache-Control $azp_web_cache_control always;
# Preserve/restate every existing security header (especially CSP, X-Content-Type-
# Options, HSTS and frame policy); nginx add_header inheritance may be overridden
# by nested location blocks. Never apply this map to Go API/WSS/auth responses.
# Never blindly replace the existing tested TLS or Kubernetes server configuration.
map $uri $azp_web_cache_control {
    default "no-store";
    / "no-cache, must-revalidate";
    /index.html "no-cache, must-revalidate";
    /game/index.html "no-cache, must-revalidate";
    /game-config.js "no-store";
    /game/game-config.js "no-store";
    /game-web-assets.json "no-store";
    ~^/assets/.+[-.][A-Za-z0-9_-]{8,}[.](?:js|css|png|svg|webp|woff2?)$ "public, max-age=31536000, immutable";
    ~^/game/ "public, max-age=0, must-revalidate";
}
