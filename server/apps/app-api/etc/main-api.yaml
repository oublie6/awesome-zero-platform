Name: main-api
Host: 0.0.0.0
Port: 8888
HTTP:
  MaxBodyBytes: 1048576
  RequestID:
    HeaderName: X-Request-Id
    MaxLength: 64
  SecurityHeaders:
    ContentTypeOptions: nosniff
    FrameOptions: DENY
    ReferrerPolicy: no-referrer
  CORS:
    Enabled: true
    AllowedOrigins:
      - http://localhost:5173
    AllowedMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    AllowedHeaders:
      - Content-Type
      - Origin
      - Accept
      - Authorization
      - X-Request-Id
    ExposedHeaders:
      - X-Request-Id
    AllowCredentials: false
MySQL:
  Addr: 127.0.0.1:3306
  Database: awesome_zero_platform
  User: app_local
  Password: local-dev-only-mysql-password
  Charset: utf8mb4
  ParseTime: true
  Location: UTC
  TimeZone: +00:00
  Timeout: 3s
  MaxOpenConns: 4
  MaxIdleConns: 2
  ConnMaxLifetime: 5m
  StartupTimeout: 3s
  ReadinessTimeout: 2s
Redis:
  Addr: 127.0.0.1:6379
  Password: local-dev-only-redis-password
  DB: 0
  PoolSize: 10
  DialTimeout: 3s
  ReadTimeout: 3s
  WriteTimeout: 3s
  StartupTimeout: 3s
  ReadinessTimeout: 2s
  Model:
    Enabled: true
    KeyPrefix: awesome-zero-platform:model
    TTL: 10m
    NotFoundTTL: 1m
Readiness:
  Timeout: 2s
Startup:
  ConnectivityTimeout: 3s
Authentication:
  Enabled: true
  Issuer: awesome-zero-platform
  AccessTokenSecret: local-dev-only-access-token-secret-change-me-0001
  AccessTTL: 15m
  RefreshTTL: 720h
  SessionKeyPrefix: authn:session:
Authorization:
  Enabled: true
  Cluster:
    Enabled: true
    InstanceID: local-app-api
    Channel: awesome-zero-platform:authz:policy-changed
    PollInterval: 20s
    PublishTimeout: 2s
    ReloadTimeout: 5s
Realtime:
  Enabled: true
  Path: /ws
  AllowedOrigins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:8080
    - http://127.0.0.1:8080
  MaxConnections: 1024
  MaxConnectionsPerAccount: 4
  SendQueueSize: 64
  MaxMessageBytes: 65536
  HandshakeTimeout: 5s
  WriteTimeout: 10s
  PongTimeout: 60s
  PingInterval: 25s
Admin:
  Enabled: true
  BootstrapToken: local-dev-only-admin-bootstrap-token-change-me-0001
Doudizhu:
  Enabled: false
Observability:
  Metrics:
    Enabled: true
    Path: /metrics
    Namespace: awesome_zero_platform
