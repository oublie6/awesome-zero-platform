name: Cocos Linux Native Client

on:
  workflow_dispatch:
    inputs:
      native_export:
        description: 'Run actual Linux native Cocos 4 WeChat export on an approved pinned self-hosted runner'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/cocos-client-smoke.yml'
      - 'scripts/cocos-linux-wechat/**'
      - 'scripts/cocos-linux-web/**'
      - 'scripts/verify-client-foundation.sh'
      - 'clients/fair-doudizhu-cocos/**'
      - 'clients/packages/game-client-core/src/**'
      - 'clients/packages/game-client-core/package*.json'
      - 'clients/packages/doudizhu-client/src/**'
      - 'clients/packages/doudizhu-client/package*.json'
      - 'clients/packages/secure-envelope/src/**'
      - 'clients/packages/secure-envelope/package*.json'

permissions:
  contents: read

concurrency:
  group: cocos-linux-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux_source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Validate Linux-only pinned engine and client project
        run: node scripts/cocos-linux-wechat/verify-toolchain.cjs
      - name: Validate native exporter scripts
        run: |
          node --check scripts/cocos-linux-wechat/install.cjs
          node --check scripts/cocos-linux-wechat/build.cjs
          node --check scripts/cocos-linux-wechat/hooks.cjs
          node --check scripts/cocos-linux-wechat/audit.cjs
      - name: Check Cocos4 Web builder and public config gates
        run: |
          node --check scripts/cocos-linux-web/build.cjs
          node --check scripts/cocos-linux-web/configure.cjs
          node --test scripts/cocos-linux-web/test.cjs
      - name: Typecheck and test portable client and scene modules
        run: bash scripts/verify-client-foundation.sh

  linux_native_export:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_export }}
    needs: linux_source
    runs-on: [self-hosted, linux, x64, cocos-cli4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Verify pinned native CLI environment and build actual WECHAT game
        env:
          COCOS_CLI_ROOT: ${{ vars.COCOS_CLI_ROOT }}
          COCOS_ENGINE_ROOT: ${{ vars.COCOS_ENGINE_ROOT }}
        run: |
          set -euo pipefail
          test -n "$COCOS_CLI_ROOT"
          node scripts/cocos-linux-wechat/verify-toolchain.cjs
          bash scripts/verify-client-foundation.sh
          node --test scripts/cocos-linux-wechat/test.cjs
          node scripts/cocos-linux-wechat/build.cjs "$RUNNER_TEMP/cocos-linux-wechat-output"
      - name: Preserve actual Linux-native WeChat package
        uses: actions/upload-artifact@v4
        with:
          name: cocos-linux-wechat-native
          path: ${{ runner.temp }}/cocos-linux-wechat-output/
          if-no-files-found: error
          retention-days: 7
