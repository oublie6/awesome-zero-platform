name: Goal 0021 One-Shot Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: goal0021-one-shot-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
      - name: Apply precise fixes and format
        run: |
          python - <<'PY'
          from pathlib import Path

          bootstrap = Path('server/apps/app-api/internal/bootstrap/bootstrap_integration_test.go')
          text = bootstrap.read_text()
          text = text.replace('schemaVersion != "0008"', 'schemaVersion != "0009"')
          text = text.replace('want 0008', 'want 0009')
          bootstrap.write_text(text)

          integration = Path('server/business/doudizhu/infrastructure/mysqlstore/integration_test.go')
          text = integration.read_text()
          old = 'actors := []domain.AccountID{prefix + "-actor-2", prefix + "-actor-3"}'
          new = 'actors := []domain.AccountID{domain.AccountID(prefix + "-actor-2"), domain.AccountID(prefix + "-actor-3")}'
          if old not in text:
              raise SystemExit('expected actor conversion line not found')
          integration.write_text(text.replace(old, new))
          PY
          cd server
          find . -name '*.go' -type f -print0 | xargs -0 gofmt -w
          cd ..
          git rm .github/workflows/goal0021-one-shot-fix.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server .github/workflows/goal0021-one-shot-fix.yml
          git commit -m "fix: complete Goal 0021 CI corrections"
          git push origin HEAD:main
