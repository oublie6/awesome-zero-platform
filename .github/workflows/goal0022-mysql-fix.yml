name: Goal 0022 MySQL Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: goal-0022-mysql-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'goal0022-ci-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Enable MySQL native password in integration config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/business/doudizhu/infrastructure/mysqlstore/integration_test.go')
          text = path.read_text()
          old = 'ParseTime: true, Loc: time.UTC, Params:'
          new = 'ParseTime: true, Loc: time.UTC, AllowNativePasswords: true, Params:'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one MySQL config match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w server/business/doudizhu/infrastructure/mysqlstore/integration_test.go
      - name: Start MySQL 5.7 and Redis
        run: make deps-reset
      - name: Apply schema and seed
        run: |
          make schema-apply
          make seed-apply
      - name: Run full integration suite
        run: make integration-test
      - name: Stop dependencies
        if: always()
        run: make deps-down
      - name: Commit verified MySQL compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/business/doudizhu/infrastructure/mysqlstore/integration_test.go
          git commit -m 'fix: enable MySQL native password in integration tests'
          git push origin HEAD:main
