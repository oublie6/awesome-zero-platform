name: Goal 0023 Format Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: goal-0023-format-fix
  cancel-in-progress: false

jobs:
  format:
    if: github.head_ref == 'goal0023-ci-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Apply repository Go formatting
        run: gofmt -w server/business/doudizhu/domain/carddeck
      - name: Verify focused package
        working-directory: server
        run: go test -count=1 -p 1 -parallel 1 ./business/doudizhu/domain/carddeck
      - name: Commit exact formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/business/doudizhu/domain/carddeck
          git commit -m 'style: format Goal 0023 carddeck package'
          git push origin HEAD:main
