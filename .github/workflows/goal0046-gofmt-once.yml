name: Goal 0046 One-time Go Format
on:
  push:
    paths:
      - '.github/workflows/goal0046-gofmt-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Format and commit Go sources
        shell: bash
        run: |
          set -euo pipefail
          find server -name '*.go' -type f -print0 | xargs -0 gofmt -w
          if git diff --quiet -- server; then
            echo 'All Go files already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server
          git commit -m 'style(go): format Goal 0046 recovery sources'
          git push origin HEAD:main
