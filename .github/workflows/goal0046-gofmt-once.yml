name: One-shot Goal 0046 gofmt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal0046-gofmt-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format Go source and commit only formatting differences
        shell: bash
        run: |
          set -euo pipefail
          find server -name '*.go' -type f -print0 | xargs -0 gofmt -w
          git add -- server
          if git diff --cached --quiet; then
            echo 'Go sources already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): gofmt consolidated Goal 0046 maintenance and recovery'
          git push origin HEAD:main
