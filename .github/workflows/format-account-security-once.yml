name: One-time Goal0062 security Go formatting
on:
  push:
    paths:
      - .github/workflows/format-account-security-once.yml
permissions:
  contents: write
jobs:
  gofmt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: gofmt exactly the Goal0062 security diff
        run: |
          gofmt -w server/platform/authn/authn.go server/platform/authn/external_session_test.go server/platform/authn/password_session_test.go server/platform/authn/adapter/redissession/store.go server/platform/authn/adapter/redissession/admin.go server/platform/authn/adapter/redissession/integration_test.go server/platform/authn/adapter/identityprovider/provider.go server/platform/authn/adapter/identityprovider/provider_test.go server/platform/identity/service.go server/platform/identity/external.go server/platform/identity/external_integration_test.go server/platform/identity/password_fingerprint_integration_test.go server/platform/admin/admin.go server/platform/admin/session_invalidation_test.go server/apps/app-api/internal/securityhttp/wechat.go server/apps/app-api/internal/securityhttp/wechat_test.go
          git diff --check
          if git diff --quiet -- server/platform/authn/authn.go server/platform/authn/external_session_test.go server/platform/authn/password_session_test.go server/platform/authn/adapter/redissession/store.go server/platform/authn/adapter/redissession/admin.go server/platform/authn/adapter/redissession/integration_test.go server/platform/authn/adapter/identityprovider/provider.go server/platform/authn/adapter/identityprovider/provider_test.go server/platform/identity/service.go server/platform/identity/external.go server/platform/identity/external_integration_test.go server/platform/identity/password_fingerprint_integration_test.go server/platform/admin/admin.go server/platform/admin/session_invalidation_test.go server/apps/app-api/internal/securityhttp/wechat.go server/apps/app-api/internal/securityhttp/wechat_test.go; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/platform/authn/authn.go server/platform/authn/external_session_test.go server/platform/authn/password_session_test.go server/platform/authn/adapter/redissession/store.go server/platform/authn/adapter/redissession/admin.go server/platform/authn/adapter/redissession/integration_test.go server/platform/authn/adapter/identityprovider/provider.go server/platform/authn/adapter/identityprovider/provider_test.go server/platform/identity/service.go server/platform/identity/external.go server/platform/identity/external_integration_test.go server/platform/identity/password_fingerprint_integration_test.go server/platform/admin/admin.go server/platform/admin/session_invalidation_test.go server/apps/app-api/internal/securityhttp/wechat.go server/apps/app-api/internal/securityhttp/wechat_test.go
          git commit -m "style(auth): gofmt Goal0062 security fixes and regressions"
          git push origin HEAD:main
