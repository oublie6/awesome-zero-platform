name: Goal 0025 Main Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0025-main-verification
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Focused compile and unit tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...

  report:
    if: always()
    needs: [focused]
    runs-on: ubuntu-latest
    steps:
      - name: Publish latest-main verification status
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            const success = '${{ needs.focused.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: ref.data.object.sha,
              state: success ? 'success' : 'failure',
              context: 'goal0025/main-focused',
              description: success
                ? 'Goal 0025 focused tests passed on latest main'
                : 'Goal 0025 focused tests failed on latest main',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
