name: Goal 0025 Main Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: goal0025-main-verification
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Focused compile and unit tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...
