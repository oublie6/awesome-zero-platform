name: Goal 0025 Main Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: goal0025-main-verification
  cancel-in-progress: true

jobs:
  repair_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve current main and publish running status
        id: main
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            const sha = ref.data.object.sha;
            core.setOutput('sha', sha);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: 'goal0025/main-repair',
              description: 'Goal 0025 repair and verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Apply exact verification fixes
        run: |
          python3 .github/scripts/goal0025_repair.py
          gofmt -w \
            server/business/doudizhu/application/service_test.go \
            server/business/doudizhu/domain/livehand/game.go \
            server/business/doudizhu/infrastructure/runtime/hand_setup_provider.go \
            server/business/gamecore/infrastructure/mysqlarchive/archive.go \
            server/apps/app-api/internal/bootstrap/bootstrap_integration_test.go \
            server/business/doudizhu/infrastructure/mysqlstore/integration_test.go
          git diff --check
      - name: Focused ordinary tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Focused race tests
        working-directory: server
        run: >-
          go test -race -count=1 -p 1 -parallel 1
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Focused vet
        working-directory: server
        run: >-
          go vet
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Start MySQL and Redis
        run: make deps-reset
      - name: Apply schema and seed
        run: |
          make schema-apply
          make seed-apply
      - name: Focused real integration
        working-directory: server
        env:
          APP_API_INTEGRATION: "1"
        run: >-
          go test -count=1 -p 1 -parallel 1 -tags=integration
          ./apps/app-api/internal/bootstrap
          ./business/doudizhu/infrastructure/mysqlstore
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Stop dependencies
        if: always()
        run: make deps-down
      - name: Commit repaired files directly to main
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            server/business/doudizhu/application/service_test.go \
            server/business/doudizhu/domain/livehand/game.go \
            server/business/doudizhu/infrastructure/runtime/hand_setup_provider.go \
            server/business/gamecore/infrastructure/mysqlarchive/archive.go \
            server/apps/app-api/internal/bootstrap/bootstrap_integration_test.go \
            server/business/doudizhu/infrastructure/mysqlstore/integration_test.go
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix: repair Goal 0025 verification"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            const sha = process.env.COMMIT_SHA || ref.data.object.sha;
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: success ? 'success' : 'failure',
              context: 'goal0025/main-repair',
              description: success
                ? 'Goal 0025 main repair and verification passed'
                : 'Goal 0025 main repair and verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
