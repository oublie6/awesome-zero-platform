name: Goal 0032 Focused Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: goal0032-focused-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=pending \
            -f context=goal0032/focused \
            -f description='Goal 0032 focused verification is running' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Format Goal 0032
        run: |
          gofmt -w \
            server/apps/app-api/internal/doudizhuapi/realtime.go \
            server/apps/app-api/internal/doudizhuapi/realtime_test.go \
            server/apps/app-api/internal/bootstrap/doudizhu.go \
            server/apps/app-api/internal/bootstrap/bootstrap.go
      - name: Focused ordinary tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./apps/app-api/internal/doudizhuapi/...
          ./apps/app-api/internal/bootstrap/...
          ./platform/realtime/...
      - name: Focused race tests
        working-directory: server
        run: >-
          go test -race -count=1 -p 1 -parallel 1
          ./apps/app-api/internal/doudizhuapi/...
          ./platform/realtime/...
      - name: Integration-tag compile
        working-directory: server
        run: >-
          go test -tags=integration -run '^$'
          ./apps/app-api/internal/bootstrap/...
          ./business/doudizhu/infrastructure/mysqlstore/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Vet
        working-directory: server
        run: >-
          go vet
          ./apps/app-api/internal/doudizhuapi/...
          ./apps/app-api/internal/bootstrap/...
          ./platform/realtime/...
      - name: Commit verified formatting and cleanup
        run: |
          rm -f .github/workflows/goal0032-focused-verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style: verify Doudizhu realtime synchronization'
            git push origin HEAD:main
          fi
      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=goal0032/focused \
            -f description='Goal 0032 focused verification passed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=failure \
            -f context=goal0032/focused \
            -f description='Goal 0032 focused verification failed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
