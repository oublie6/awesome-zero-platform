name: One-shot Round 10 repair gofmt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal0046-round10-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format changed Go files then remove temporary formatter
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w server/business/doudizhu/application/hand_commands.go server/business/doudizhu/application/room_queries.go server/business/doudizhu/application/room_queries_test.go server/business/doudizhu/infrastructure/mysqlstore/expiry_rejection_integration_test.go
          git add -- server/business/doudizhu
          git rm .github/workflows/goal0046-round10-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): gofmt Round10 expiry and historical room permissions'
          git push origin HEAD:main
