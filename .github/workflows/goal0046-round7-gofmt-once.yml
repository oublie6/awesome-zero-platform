name: One-shot Round 7 gofmt
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal0046-round7-gofmt-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format Round 7 Go changes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            server/business/doudizhu/application/lifecycle/supervisor.go \
            server/business/doudizhu/application/lifecycle/historical.go \
            server/business/doudizhu/application/lifecycle/supervisor_test.go \
            server/business/doudizhu/application/service.go \
            server/business/doudizhu/application/service_test.go \
            server/business/doudizhu/infrastructure/mysqlstore/integration_test.go
          git add -- server
          git rm .github/workflows/goal0046-round7-gofmt-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): format Round 7 P1/P2 repair tests'
          git push origin HEAD:main
