name: Temporary Round18 Gofmt

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-r18-gofmt.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/r18-recovery-mode'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r18-recovery-mode
          persist-credentials: true
          fetch-depth: 0
      - name: Format new and changed Go files only
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only origin/main...HEAD -- '*.go' > /tmp/r18-go-files
          while IFS= read -r path; do
            test -f "$path" && gofmt -w "$path"
          done < /tmp/r18-go-files
          git add -- '*.go'
          if ! git diff --cached --quiet; then
            git commit -m 'style(go): format Round18 recovery fixes'
            git push origin HEAD:fix/r18-recovery-mode
          fi
