name: Goal 0026 Runtime Application Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0026-runtime-application-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve latest main and publish pending status
        id: main
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' });
            const sha = ref.data.object.sha;
            core.setOutput('sha', sha);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha,
              state: 'pending', context: 'goal0026/runtime-application',
              description: 'Goal 0026 runtime/application verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.main.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Verify formatting
        run: |
          files=$(gofmt -l server/business/doudizhu/domain/bidding server/business/doudizhu/domain/livehand server/business/doudizhu/application server/business/doudizhu/infrastructure/runtime server/business/doudizhu/infrastructure/mysqlstore/live_bid_stub_integration_test.go)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Focused ordinary tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
      - name: Focused race tests
        working-directory: server
        run: >-
          go test -race -count=1 -p 1 -parallel 1
          ./business/doudizhu/domain/bidding
          ./business/doudizhu/domain/livehand
          ./business/doudizhu/application
          ./business/doudizhu/infrastructure/runtime
      - name: Integration-tag compile
        working-directory: server
        run: go test -run '^$' -count=1 -tags=integration ./business/doudizhu/infrastructure/mysqlstore
      - name: Focused vet
        working-directory: server
        run: >-
          go vet
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/doudizhu/infrastructure/mysqlstore/...
      - name: Publish result
        if: always()
        uses: actions/github-script@v7
        env:
          SHA: ${{ steps.main.outputs.sha }}
          JOB: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.SHA,
              state: success ? 'success' : 'failure', context: 'goal0026/runtime-application',
              description: success ? 'Goal 0026 runtime/application passed' : 'Goal 0026 runtime/application failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
