name: Goal 0033 Server v1 Release Verification

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0033-server-v1-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=pending \
            -f context=goal0033/release \
            -f description='Server v1 release verification is running' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Verify focused configuration and generator tests
        working-directory: server
        run: go test -count=1 -p 1 -parallel 1 ./apps/app-api/internal/config ./foundation/revealkeys/cmd/local-env
      - name: Verify generated local Doudizhu production configuration
        env:
          APP_MYSQL_PASSWORD: ci-mysql-password
          APP_MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          APP_REDIS_PASSWORD: ci-redis-password
          APP_AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
          APP_ADMIN_BOOTSTRAP_TOKEN: ci-admin-bootstrap-token-0123456789abcdef
          APP_HTTPS_ENABLED: 'false'
        run: |
          eval "$(cd server && go run ./foundation/revealkeys/cmd/local-env)"
          test "$APP_REVEAL_KEYS_ENABLED" = true
          test "$APP_DOUDIZHU_ENABLED" = true
          test -n "$APP_REVEAL_KEYS_STATIC_JSON"
          test -n "$APP_DOUDIZHU_BEACON_PROVIDER"
          test -n "$APP_DOUDIZHU_BEACON_ROUND"
          test -n "$APP_DOUDIZHU_BEACON_PROOF_SECRET"
          test -n "$APP_DOUDIZHU_CONTRIBUTION_KEY_ID"
          test ${#APP_DOUDIZHU_CONTRIBUTION_KEY_HEX} -eq 64
          bash scripts/production-compose.sh config >/dev/null
      - name: Verify release documentation baseline
        run: |
          test -f docs/operations/server-v1-release.md
          grep -q '^## Server v1 status$' README.md
          grep -q 'doudizhu.command' docs/operations/server-v1-release.md
          grep -q 'APP_DOUDIZHU_BEACON_PROVIDER' docs/operations/production-deployment.md
          grep -q 'APP_DOUDIZHU_CONTRIBUTION_KEY_ID' server/README.md
          ! grep -q 'Fair Doudizhu transport endpoints.*remain deliberately deferred' README.md
          git diff --exit-code
      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=goal0033/release \
            -f description='Server v1 release configuration and documentation passed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=failure \
            -f context=goal0033/release \
            -f description='Server v1 release verification failed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
