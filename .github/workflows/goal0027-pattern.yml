name: Goal 0027 Pattern Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: goal0027-pattern-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -d "{\"state\":\"pending\",\"context\":\"goal0027/pattern\",\"description\":\"Pattern verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Format focused package
        run: gofmt -w server/business/doudizhu/domain/playing

      - name: Verify pattern rules
        working-directory: server
        run: |
          go test -count=1 ./business/doudizhu/domain/playing
          go test -count=1 -race ./business/doudizhu/domain/playing
          go vet ./business/doudizhu/domain/playing

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/business/doudizhu/domain/playing
          git commit -m "style: format Goal 0027 playing rules"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          sha="$(git rev-parse origin/main)"
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="Pattern formatting, tests, race, and vet succeeded"
          else
            state=failure
            description="Pattern verification failed"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -d "{\"state\":\"${state}\",\"context\":\"goal0027/pattern\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
