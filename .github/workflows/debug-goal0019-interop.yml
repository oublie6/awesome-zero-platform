name: Debug Goal 0019 Interop

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    if: github.head_ref == 'goal0019-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Generate TypeScript vector
        working-directory: clients/packages/secure-envelope
        run: |
          npm install --no-audit --no-fund
          npm run generate:interop-vector -- "$RUNNER_TEMP/secure-envelope-vector.json"
      - name: Run Go interoperability test
        id: interop
        working-directory: server
        env:
          SECURE_ENVELOPE_INTEROP_VECTOR: ${{ runner.temp }}/secure-envelope-vector.json
        run: |
          set +e
          go test -v -count=1 -p 1 -parallel 1 ./foundation/secureenvelope > "$RUNNER_TEMP/secure-envelope-go.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/secure-envelope-go.log"
          exit $status
      - name: Upload interoperability log and vector
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal0019-interop-debug
          path: |
            ${{ runner.temp }}/secure-envelope-go.log
            ${{ runner.temp }}/secure-envelope-vector.json
