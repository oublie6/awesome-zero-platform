name: One-time account Go formatting
on:
  push:
    paths:
      - .github/workflows/format-accounts-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Format only account implementation files
        run: |
          gofmt -w server/platform/identity/external.go server/platform/identity/external_test.go server/platform/identity/external_integration_test.go server/platform/identity/integration_test.go server/apps/app-api/internal/securityhttp/wechat.go
          git diff --check
          if git diff --quiet -- server/platform/identity server/apps/app-api/internal/securityhttp/wechat.go; then
            echo "No formatting change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/platform/identity/external.go server/platform/identity/external_test.go server/platform/identity/external_integration_test.go server/platform/identity/integration_test.go server/apps/app-api/internal/securityhttp/wechat.go
          git commit -m "style(identity): gofmt account binding implementation"
          git push origin HEAD:main
