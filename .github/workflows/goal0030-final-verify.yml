name: Goal 0030 Final Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.id == 30409676485
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha -f state=pending -f context=goal0030/final-full -f description='Goal 0030 full verification is running' -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
      - name: Server verification
        run: |
          cd server
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          cd ..
          make generate
          git diff --exit-code -- server/apps/app-api
          make fmt-check
          cd server
          go test -count=1 -p 1 -parallel 1 ./business/doudizhu/application/lifecycle/...
          go test -race -count=1 -p 1 -parallel 1 ./business/doudizhu/application/lifecycle/...
          go vet ./business/doudizhu/application/lifecycle/...
          cd ..
          make test
          make build
          docker compose -f deploy/local/docker-compose.yml config >/dev/null
          bash scripts/test-production-compose.sh
      - name: Client verification
        run: |
          cd clients/packages/secure-envelope
          npm install --no-audit --no-fund
          npm test
          cd ../../admin-web
          npm install --no-audit --no-fund
          npm run build
      - name: Real MySQL and Redis integration
        run: |
          make deps-reset
          trap 'make deps-down' EXIT
          make schema-apply
          make seed-apply
          make integration-test
      - name: Production runtime acceptance
        run: bash scripts/ci-runtime-acceptance.sh
      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha -f state=success -f context=goal0030/final-full -f description='Goal 0030 full repository and runtime verification passed' -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
