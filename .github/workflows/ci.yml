name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
      - name: Verify module files
        id: module-files
        working-directory: server
        run: |
          go mod tidy
          git diff -- go.mod go.sum | tee module-diff.patch
          git diff --exit-code -- go.mod go.sum
      - name: Upload module tidy difference
        if: failure() && steps.module-files.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: module-tidy-diff
          path: server/module-diff.patch
      - name: Verify generated code
        run: |
          make generate
          git diff --exit-code -- server/apps/app-api
      - name: Verify formatting
        run: make fmt-check
      - name: Unit tests
        id: unit-tests
        run: |
          set +e
          make test > unit-tests.log 2>&1
          status=$?
          tail -n 80 unit-tests.log
          exit $status
      - name: Upload unit failure log
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-failure-log
          path: unit-tests.log
      - name: Security and Admin race tests
        working-directory: server
        run: go test -race -count=1 -p 1 -parallel 1 ./foundation/cache/... ./platform/identity/... ./platform/authn/... ./platform/authz/... ./platform/admin/...
      - name: Build
        run: make build
      - name: Validate local Compose
        run: docker compose -f deploy/local/docker-compose.yml config >/dev/null
      - name: Validate production Compose
        env:
          APP_MYSQL_PASSWORD: ci-mysql-password
          APP_MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          APP_REDIS_PASSWORD: ci-redis-password
          APP_AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
          APP_ADMIN_BOOTSTRAP_TOKEN: ci-admin-bootstrap-token-0123456789abcdef
        run: docker compose -f deploy/production/docker-compose.yml config >/dev/null

  admin_web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        id: admin-build
        run: |
          set +e
          npm run build > admin-web-build.log 2>&1
          status=$?
          tail -n 80 admin-web-build.log
          exit $status
      - name: Upload Admin web failure log
        if: failure() && steps.admin-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-failure-log
          path: clients/admin-web/admin-web-build.log
      - name: Verify clean client build inputs
        run: git diff --exit-code -- package.json src

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Verify module files
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Start MySQL 5.7 and Redis
        run: make deps-reset
      - name: Apply schema and seed
        run: |
          make schema-apply
          make seed-apply
      - name: Integration and clustered authorization tests
        id: integration-tests
        run: |
          set +e
          make integration-test > integration-tests.log 2>&1
          status=$?
          tail -n 120 integration-tests.log
          exit $status
      - name: Upload integration failure log
        if: failure() && steps.integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-log
          path: integration-tests.log
      - name: Stop dependencies
        if: always()
        run: make deps-down

  runtime:
    if: github.event_name == 'push'
    needs: [unit, admin_web, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Production Compose runtime acceptance
        id: runtime-acceptance
        run: |
          set +e
          bash scripts/ci-runtime-acceptance.sh > runtime-acceptance.log 2>&1
          status=$?
          tail -n 200 runtime-acceptance.log
          exit $status
      - name: Upload runtime acceptance failure log
        if: failure() && steps.runtime-acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance-failure-log
          path: runtime-acceptance.log

  report:
    if: always() && github.event_name == 'push'
    needs: [unit, admin_web, integration, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Publish full verification status
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              unit: '${{ needs.unit.result }}',
              adminWeb: '${{ needs.admin_web.result }}',
              integration: '${{ needs.integration.result }}',
              runtime: '${{ needs.runtime.result }}'
            };
            const success = Object.values(results).every(result => result === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ci/full',
              description: success
                ? 'Go, Vue, MySQL 5.7, clustered authorization and Compose runtime passed'
                : `Verification failed: ${JSON.stringify(results)}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });