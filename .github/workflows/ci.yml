name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
      - name: Resolve modules
        working-directory: server
        run: go mod tidy
      - name: Format source
        run: make fmt
      - name: Verify generated code
        run: make generate
      - name: Unit tests
        run: make test
      - name: Build
        run: make build
      - name: Upload normalized source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalized-source
          path: |
            Makefile
            server/go.mod
            server/go.sum
            server/**/*.go
          if-no-files-found: error
          retention-days: 1
      - name: Verify committed source is normalized
        if: always()
        run: git diff --exit-code -- Makefile server

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Resolve modules
        working-directory: server
        run: go mod tidy
      - name: Start dependencies
        run: make deps-reset
      - name: Apply schema and seed
        run: |
          make schema-apply
          make seed-apply
      - name: Integration tests
        run: make integration-test
      - name: Stop dependencies
        if: always()
        run: make deps-down
