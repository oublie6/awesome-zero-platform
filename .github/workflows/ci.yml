name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
      - name: Verify module files
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify generated code
        run: |
          make generate
          git diff --exit-code -- server/apps/app-api
      - name: Verify formatting
        run: make fmt-check
      - name: Unit tests
        run: make test
      - name: Security and Admin race tests
        working-directory: server
        run: go test -race -p 1 -parallel 1 ./platform/authn/... ./platform/authz/... ./platform/admin/...
      - name: Build
        run: make build
      - name: Validate production Compose
        env:
          APP_MYSQL_PASSWORD: ci-mysql-password
          APP_MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          APP_REDIS_PASSWORD: ci-redis-password
          APP_AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
          APP_ADMIN_BOOTSTRAP_TOKEN: ci-admin-bootstrap-token-0123456789abcdef
        run: docker compose -f deploy/production/docker-compose.yml config >/dev/null

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Verify clean client build inputs
        run: git diff --exit-code -- package.json src

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Verify module files
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Start dependencies
        run: make deps-reset
      - name: Apply schema and seed
        run: |
          make schema-apply
          make seed-apply
      - name: Integration tests
        run: make integration-test
      - name: Stop dependencies
        if: always()
        run: make deps-down
