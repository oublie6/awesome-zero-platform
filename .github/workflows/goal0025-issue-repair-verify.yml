name: Goal 0025 Issue Repair Verification

on:
  issues:
    types: [opened]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0025-issue-repair-verify
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.issue.title == 'Goal 0025 Repair Verification Trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve current main and publish running status
        id: main
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            const sha = ref.data.object.sha;
            core.setOutput('sha', sha);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: 'goal0025/issue-repair-verify',
              description: 'Goal 0025 repair verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Apply exact verification fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('server/apps/app-api/internal/bootstrap/bootstrap_integration_test.go')
          text = bootstrap.read_text()
          text = text.replace('schemaVersion != "0010"', 'schemaVersion != "0011"')
          text = text.replace('schema version = %q, want 0010', 'schema version = %q, want 0011')
          marker = '\t\t"platform_audit_events",\n'
          if '\t\t"game_final_records",\n' not in text:
              text = text.replace(marker, marker + '\t\t"game_final_records",\n')
          bootstrap.write_text(text)

          integration = Path('server/business/doudizhu/infrastructure/mysqlstore/integration_test.go')
          text = integration.read_text()
          import_marker = '\t"github.com/oublie6/awesome-zero-platform/server/business/doudizhu/domain"\n'
          if 'server/business/gamecore"' not in text:
              text = text.replace(import_marker, import_marker + '\t"github.com/oublie6/awesome-zero-platform/server/business/gamecore"\n')

          replacements = [
              (
                  'application.NewService(store, clock, ids, integrationSetup{}, opener, protector, textnormalization.NFKC{}, application.DefaultConfig())',
                  'application.NewService(store, clock, ids, integrationSetup{}, integrationBeaconVerifier{}, integrationLiveRuntime{}, opener, protector, textnormalization.NFKC{}, application.DefaultConfig())',
              ),
              (
                  '''\t\tstore, clock, &integrationIDs{prefix: prefix}, integrationSetup{},
\t\t&integrationOpener{}, protector, textnormalization.NFKC{}, application.DefaultConfig(),
''',
                  '''\t\tstore, clock, &integrationIDs{prefix: prefix}, integrationSetup{},
\t\tintegrationBeaconVerifier{}, integrationLiveRuntime{},
\t\t&integrationOpener{}, protector, textnormalization.NFKC{}, application.DefaultConfig(),
''',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)

          setup_marker = '''func (integrationSetup) PrepareHand(context.Context, domain.RoomSnapshot, domain.HandID) (application.HandSetup, error) {
\treturn application.HandSetup{}, fmt.Errorf("not used")
}
'''
          if 'func (integrationSetup) ReleaseHand' not in text:
              if setup_marker not in text:
                  raise SystemExit('integration setup marker not found')
              text = text.replace(setup_marker, setup_marker + '\nfunc (integrationSetup) ReleaseHand(context.Context, domain.HandID) error { return nil }\n', 1)

          opener_marker = 'type integrationOpener struct {\n'
          stubs = '''type integrationBeaconVerifier struct{}

func (integrationBeaconVerifier) Verify(_ context.Context, _ domain.BeaconPlan, value domain.BeaconValue) (domain.BeaconValue, error) {
\treturn value, nil
}

type integrationLiveRuntime struct{}

func (integrationLiveRuntime) Start(context.Context, domain.HandSnapshot) error { return fmt.Errorf("not used") }
func (integrationLiveRuntime) RollbackStart(context.Context, domain.HandID) error { return nil }
func (integrationLiveRuntime) ReleasePrepared(context.Context, domain.HandID) error { return nil }
func (integrationLiveRuntime) PublicView(context.Context, domain.HandID, domain.AccountID) (application.LiveHandView, error) {
\treturn application.LiveHandView{}, fmt.Errorf("not used")
}
func (integrationLiveRuntime) PrivateView(context.Context, domain.HandID, domain.AccountID) (application.LiveHandView, error) {
\treturn application.LiveHandView{}, fmt.Errorf("not used")
}
func (integrationLiveRuntime) Abort(context.Context, domain.HandID, string) (gamecore.FinalRecord, error) {
\treturn gamecore.FinalRecord{}, fmt.Errorf("not used")
}
func (integrationLiveRuntime) RetryArchive(context.Context, domain.HandID) (gamecore.FinalRecord, error) {
\treturn gamecore.FinalRecord{}, fmt.Errorf("not used")
}
func (integrationLiveRuntime) Contains(domain.HandID) bool { return false }

'''
          if 'type integrationBeaconVerifier struct{}' not in text:
              if opener_marker not in text:
                  raise SystemExit('integration opener marker not found')
              text = text.replace(opener_marker, stubs + opener_marker, 1)

          required = [
              'integrationBeaconVerifier{}',
              'integrationLiveRuntime{}',
              'func (integrationSetup) ReleaseHand',
              'type integrationBeaconVerifier struct{}',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'integration fixture repair incomplete: {missing}')
          integration.write_text(text)
          PY
          gofmt -w \
            server/business/doudizhu/application/service_test.go \
            server/business/doudizhu/domain/livehand/game.go \
            server/business/doudizhu/infrastructure/runtime/hand_setup_provider.go \
            server/business/gamecore/infrastructure/mysqlarchive/archive.go \
            server/apps/app-api/internal/bootstrap/bootstrap_integration_test.go \
            server/business/doudizhu/infrastructure/mysqlstore/integration_test.go
          git diff --check
      - name: Focused ordinary tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Focused race tests
        working-directory: server
        run: >-
          go test -race -count=1 -p 1 -parallel 1
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Focused vet
        working-directory: server
        run: >-
          go vet
          ./business/gamecore/...
          ./business/doudizhu/domain/...
          ./business/doudizhu/application/...
          ./business/doudizhu/infrastructure/runtime/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Start MySQL and Redis
        run: make deps-reset
      - name: Apply schema and seed
        run: |
          make schema-apply
          make seed-apply
      - name: Focused real integration
        working-directory: server
        env:
          APP_API_INTEGRATION: "1"
        run: >-
          go test -count=1 -p 1 -parallel 1 -tags=integration
          ./apps/app-api/internal/bootstrap
          ./business/doudizhu/infrastructure/mysqlstore
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Stop dependencies
        if: always()
        run: make deps-down
      - name: Stage repaired source bundle
        if: success()
        run: |
          mkdir -p repair-source/server/business/doudizhu/application
          mkdir -p repair-source/server/business/doudizhu/domain/livehand
          mkdir -p repair-source/server/business/doudizhu/infrastructure/runtime
          mkdir -p repair-source/server/business/doudizhu/infrastructure/mysqlstore
          mkdir -p repair-source/server/business/gamecore/infrastructure/mysqlarchive
          mkdir -p repair-source/server/apps/app-api/internal/bootstrap
          cp server/business/doudizhu/application/service_test.go repair-source/server/business/doudizhu/application/
          cp server/business/doudizhu/domain/livehand/game.go repair-source/server/business/doudizhu/domain/livehand/
          cp server/business/doudizhu/infrastructure/runtime/hand_setup_provider.go repair-source/server/business/doudizhu/infrastructure/runtime/
          cp server/business/doudizhu/infrastructure/mysqlstore/integration_test.go repair-source/server/business/doudizhu/infrastructure/mysqlstore/
          cp server/business/gamecore/infrastructure/mysqlarchive/archive.go repair-source/server/business/gamecore/infrastructure/mysqlarchive/
          cp server/apps/app-api/internal/bootstrap/bootstrap_integration_test.go repair-source/server/apps/app-api/internal/bootstrap/
      - name: Upload repaired source bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goal0025-repaired-source
          path: repair-source
      - name: Publish final verification status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.MAIN_SHA,
              state: success ? 'success' : 'failure',
              context: 'goal0025/issue-repair-verify',
              description: success
                ? 'Goal 0025 repaired source passed verification'
                : 'Goal 0025 repaired source failed verification',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
