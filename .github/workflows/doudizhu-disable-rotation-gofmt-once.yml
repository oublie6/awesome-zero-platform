name: One-shot disable legacy rotation gofmt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/doudizhu-disable-rotation-gofmt-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format Go policy and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w server/apps/doudizhu-maintenance/main.go server/apps/doudizhu-maintenance/key_policy.go server/apps/doudizhu-maintenance/key_policy_test.go
          git add -- server/apps/doudizhu-maintenance/
          git rm .github/workflows/doudizhu-disable-rotation-gofmt-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): format disabled legacy key rotation policy'
          git push origin HEAD:main
