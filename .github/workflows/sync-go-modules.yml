name: Synchronize Go Modules

on:
  push:
    branches: [main]
    paths:
      - server/go.mod
      - server/go.sum
      - .github/workflows/sync-go-modules.yml

permissions:
  contents: write

concurrency:
  group: sync-go-modules-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache: false
      - name: Generate authoritative module files
        working-directory: server
        run: go mod tidy
      - name: Commit module files when changed
        run: |
          git add server/go.mod server/go.sum
          if git diff --cached --quiet; then
            echo "module files already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize go module files"
          git push origin HEAD:main
