name: Goal 0031 Focused Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: goal0031-focused-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.id == 30409676485
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Format plaintext implementation
        run: |
          gofmt -w \
            server/apps/app-api/internal/doudizhuapi/*.go \
            server/apps/app-api/internal/bootstrap/bootstrap.go \
            server/apps/app-api/internal/bootstrap/doudizhu.go \
            server/apps/app-api/internal/config/*.go \
            server/business/doudizhu/infrastructure/runtime/hmac_beacon_proof*.go
      - name: Focused ordinary tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./apps/app-api/internal/doudizhuapi/...
          ./apps/app-api/internal/config/...
          ./apps/app-api/internal/bootstrap/...
          ./business/doudizhu/infrastructure/runtime/...
      - name: Focused race tests
        working-directory: server
        run: >-
          go test -race -count=1 -p 1 -parallel 1
          ./apps/app-api/internal/doudizhuapi/...
          ./business/doudizhu/infrastructure/runtime/...
      - name: Integration-tag compile
        working-directory: server
        run: >-
          go test -tags=integration -run '^$'
          ./apps/app-api/internal/bootstrap/...
          ./business/doudizhu/infrastructure/mysqlstore/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Vet
        working-directory: server
        run: >-
          go vet
          ./apps/app-api/internal/doudizhuapi/...
          ./apps/app-api/internal/config/...
          ./apps/app-api/internal/bootstrap/...
          ./business/doudizhu/infrastructure/runtime/...
      - name: Commit formatting and staging cleanup
        run: |
          rm -rf .github/server-v1
          rm -f .github/workflows/goal0031-apply-verify.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: verify authenticated Doudizhu HTTP API'
          git push origin HEAD:main
      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=goal0031/focused \
            -f description='Goal 0031 focused verification passed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=failure \
            -f context=goal0031/focused \
            -f description='Goal 0031 focused verification failed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
