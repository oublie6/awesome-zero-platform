name: Apply Goal 0019

on:
  push:
    branches: [main]
    paths:
      - '.goal0019.part.*'
      - '.github/workflows/apply-goal0019.yml'

permissions:
  contents: write

concurrency:
  group: apply-goal-0019
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore implementation payload
        run: |
          cat .goal0019.part.* | base64 --decode > "$RUNNER_TEMP/goal0019.tar.gz"
          tar -xzf "$RUNNER_TEMP/goal0019.tar.gz" -C .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Install and test TypeScript secure envelope
        working-directory: clients/packages/secure-envelope
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run generate:interop-vector -- "$RUNNER_TEMP/secure-envelope-vector.json"
      - name: Normalize Go modules and test interoperability
        working-directory: server
        env:
          SECURE_ENVELOPE_INTEROP_VECTOR: ${{ runner.temp }}/secure-envelope-vector.json
        run: |
          go mod tidy
          gofmt -w foundation/secureenvelope
          go test -count=1 -p 1 -parallel 1 ./foundation/secureenvelope
          go test -race -count=1 -p 1 -parallel 1 ./foundation/secureenvelope/...
      - name: Remove one-time bootstrap files
        run: rm -f .goal0019.part.* .github/workflows/apply-goal0019.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: add secure envelope client and server foundation'
          git push origin HEAD:main
