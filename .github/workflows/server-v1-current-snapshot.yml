name: Server V1 Current Source Snapshot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  snapshot:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.id == 30409676485
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Capture source
        run: tar --exclude=.git --exclude=node_modules --exclude='*.log' -czf /tmp/awesome-zero-platform-current.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: awesome-zero-platform-current-source
          path: /tmp/awesome-zero-platform-current.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=server-v1/current-snapshot \
            -f description='Latest server v1 source snapshot captured' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
