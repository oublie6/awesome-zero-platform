name: Goal 0021 Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0021-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$sha" \
            -d "{\"state\":\"pending\",\"context\":\"ci/goal0021\",\"description\":\"Goal 0021 full verification running\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
      - name: Verify module files
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify generated code and formatting
        run: |
          make generate
          git diff --exit-code -- server/apps/app-api
          make fmt-check
      - name: Full Go unit tests
        run: make test
      - name: Doudizhu race and vet
        working-directory: server
        run: |
          go test -race -count=1 -p 1 -parallel 1 \
            ./business/doudizhu/domain/... \
            ./business/doudizhu/application/... \
            ./business/doudizhu/infrastructure/protection/... \
            ./business/doudizhu/infrastructure/mysqlstore/... \
            ./business/doudizhu/infrastructure/runtime/... \
            ./business/doudizhu/infrastructure/textnormalization/...
          go vet ./business/doudizhu/domain/... ./business/doudizhu/application/... ./business/doudizhu/infrastructure/...
      - name: Secure-envelope client and interoperability
        run: |
          cd clients/packages/secure-envelope
          npm install --no-audit --no-fund
          npm test
          npm run generate:interop-vector -- "$RUNNER_TEMP/secure-envelope-vector.json"
          cd ../../../server
          SECURE_ENVELOPE_INTEROP_VECTOR="$RUNNER_TEMP/secure-envelope-vector.json" \
            go test -count=1 -p 1 -parallel 1 ./foundation/secureenvelope
      - name: Admin web build
        working-directory: clients/admin-web
        run: |
          npm install --no-audit --no-fund
          npm run build
          git diff --exit-code -- package.json src
      - name: Real MySQL and Redis integration
        id: integration
        run: |
          set +e
          {
            make deps-reset
            make schema-apply
            make seed-apply
            make integration-test
            make deps-down
          } > "$RUNNER_TEMP/goal0021-integration.log" 2>&1
          status=$?
          tail -n 240 "$RUNNER_TEMP/goal0021-integration.log"
          exit $status
      - name: Upload integration failure log
        if: failure() && steps.integration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: goal0021-integration-failure
          path: ${{ runner.temp }}/goal0021-integration.log
      - name: Compose and runtime acceptance
        id: runtime
        env:
          APP_MYSQL_PASSWORD: ci-mysql-password
          APP_MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          APP_REDIS_PASSWORD: ci-redis-password
          APP_AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
          APP_ADMIN_BOOTSTRAP_TOKEN: ci-admin-bootstrap-token-0123456789abcdef
        run: |
          set +e
          {
            docker compose -f deploy/local/docker-compose.yml config >/dev/null
            APP_HTTPS_ENABLED=false bash scripts/production-compose.sh config >/dev/null
            bash scripts/ci-runtime-acceptance.sh
          } > "$RUNNER_TEMP/goal0021-runtime.log" 2>&1
          status=$?
          tail -n 240 "$RUNNER_TEMP/goal0021-runtime.log"
          exit $status
      - name: Upload runtime failure log
        if: failure() && steps.runtime.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: goal0021-runtime-failure
          path: ${{ runner.temp }}/goal0021-runtime.log
      - name: Stop dependencies after failure
        if: always()
        run: |
          make deps-down || true
          bash scripts/production-compose.sh down --remove-orphans || true
      - name: Mark verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$sha" \
            -d "{\"state\":\"success\",\"context\":\"ci/goal0021\",\"description\":\"Goal 0021 full verification passed\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
      - name: Mark verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$sha" \
            -d "{\"state\":\"failure\",\"context\":\"ci/goal0021\",\"description\":\"Goal 0021 full verification failed\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
