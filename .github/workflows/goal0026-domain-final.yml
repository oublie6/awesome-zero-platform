name: Goal 0026 Domain Final Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0026-domain-final-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve latest main and publish pending status
        id: main
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' });
            const sha = ref.data.object.sha;
            core.setOutput('sha', sha);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha,
              state: 'pending', context: 'goal0026/domain-final',
              description: 'Goal 0026 final domain verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.main.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Verify formatting
        run: |
          files=$(gofmt -l server/business/doudizhu/domain/bidding server/business/doudizhu/domain/livehand)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: All Doudizhu domain tests
        working-directory: server
        run: go test -count=1 -p 1 -parallel 1 ./business/doudizhu/domain/...
      - name: Live bidding race tests
        working-directory: server
        run: go test -race -count=1 -p 1 -parallel 1 ./business/doudizhu/domain/bidding ./business/doudizhu/domain/livehand
      - name: Domain vet
        working-directory: server
        run: go vet ./business/doudizhu/domain/...
      - name: Publish result
        if: always()
        uses: actions/github-script@v7
        env:
          SHA: ${{ steps.main.outputs.sha }}
          JOB: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.SHA,
              state: success ? 'success' : 'failure', context: 'goal0026/domain-final',
              description: success ? 'Goal 0026 final domain checks passed' : 'Goal 0026 final domain checks failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
