name: Server V1 Source Snapshot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: server-v1-source-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=pending \
            -f context=server-v1/source-snapshot \
            -f description='Capturing latest main source snapshot' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Capture source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude='*.log' -czf /tmp/awesome-zero-platform-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: awesome-zero-platform-main-source
          path: /tmp/awesome-zero-platform-main.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=server-v1/source-snapshot \
            -f description='Latest main source snapshot captured' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
