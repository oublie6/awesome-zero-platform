name: Apply Admin Hardening

on:
  push:
    branches:
      - agent/admin-platform
    paths:
      - scripts/apply-admin-hardening.py
      - .github/workflows/admin-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-admin-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-platform
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply hardening
        run: python scripts/apply-admin-hardening.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: harden Admin authorization UX and safety"
          git push origin HEAD:agent/admin-platform
