name: Goal 0029 Archive Read Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: goal0029-archive-read-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Format archive package
        run: gofmt -w server/business/gamecore/infrastructure/mysqlarchive
      - name: Verify archive read side
        working-directory: server
        run: |
          go test -count=1 ./business/gamecore/infrastructure/mysqlarchive
          go test -count=1 -race ./business/gamecore/infrastructure/mysqlarchive
          go vet ./business/gamecore/infrastructure/mysqlarchive
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/business/gamecore/infrastructure/mysqlarchive
          git commit -m "style: format Goal 0029 archive read side"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          sha="$(git rev-parse origin/main)"
          if [ "${{ job.status }}" = "success" ]; then state=success; description="Archive read formatting, tests, race, and vet passed"; else state=failure; description="Archive read verification failed"; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -d "{\"state\":\"${state}\",\"context\":\"goal0029/archive-read\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
