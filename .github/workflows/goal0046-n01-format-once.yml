name: One-shot Goal 0046 N01 gofmt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal0046-n01-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format changed Go files and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            server/business/doudizhu/application/live_contracts.go \
            server/business/doudizhu/application/hand_bidding.go \
            server/business/doudizhu/application/hand_playing.go \
            server/business/doudizhu/application/live_receipt_replay_test.go \
            server/business/doudizhu/infrastructure/runtime/live_receipt_queries.go \
            server/business/doudizhu/infrastructure/mysqlstore/live_three_seat_recovery_integration_test.go \
            server/apps/app-api/internal/doudizhuapi/dispatcher.go \
            server/apps/app-api/internal/doudizhuapi/historical_replay_test.go \
            server/apps/app-api/internal/doudizhuapi/realtime.go \
            server/apps/app-api/internal/doudizhuapi/realtime_test.go
          git add -- server
          git rm .github/workflows/goal0046-n01-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): gofmt N01 historical receipt replay repair'
          git push origin HEAD:main
