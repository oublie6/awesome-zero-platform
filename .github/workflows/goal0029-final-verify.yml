name: Goal 0029 Final Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0029-final-main
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=pending \
            -f context=goal0029/final-full \
            -f description='Goal 0029 full verification is running' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  server:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
      - name: Verify module files
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify generated code
        run: |
          make generate
          git diff --exit-code -- server/apps/app-api
      - name: Verify formatting
        run: make fmt-check
      - name: Goal 0029 ordinary tests
        working-directory: server
        run: >-
          go test -count=1 -p 1 -parallel 1
          ./business/doudizhu/domain/livehand/...
          ./business/doudizhu/application/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Goal 0029 race tests
        working-directory: server
        run: >-
          go test -race -count=1 -p 1 -parallel 1
          ./business/doudizhu/domain/livehand/...
          ./business/doudizhu/application/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: Goal 0029 vet
        working-directory: server
        run: >-
          go vet
          ./business/doudizhu/domain/livehand/...
          ./business/doudizhu/application/...
          ./business/gamecore/infrastructure/mysqlarchive/...
      - name: All Go tests
        run: make test
      - name: Security, Admin and realtime race tests
        working-directory: server
        run: >-
          go test -race -count=1 -p 1 -parallel 1
          ./foundation/cache/...
          ./foundation/secureenvelope/...
          ./platform/identity/...
          ./platform/authn/...
          ./platform/authz/...
          ./platform/admin/...
          ./platform/realtime/...
      - name: Build
        run: make build
      - name: Validate local Compose
        run: docker compose -f deploy/local/docker-compose.yml config >/dev/null
      - name: Test production HTTPS switch
        run: bash scripts/test-production-compose.sh
      - name: Validate production Compose modes
        env:
          APP_MYSQL_PASSWORD: ci-mysql-password
          APP_MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          APP_REDIS_PASSWORD: ci-redis-password
          APP_AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-0123456789abcdef
          APP_ADMIN_BOOTSTRAP_TOKEN: ci-admin-bootstrap-token-0123456789abcdef
        run: |
          APP_HTTPS_ENABLED=false bash scripts/production-compose.sh config >/dev/null
          touch "$RUNNER_TEMP/ci-tls.crt" "$RUNNER_TEMP/ci-tls.key"
          APP_HTTPS_ENABLED=true \
            APP_TLS_CERT_FILE="$RUNNER_TEMP/ci-tls.crt" \
            APP_TLS_KEY_FILE="$RUNNER_TEMP/ci-tls.key" \
            bash scripts/production-compose.sh config >/dev/null

  clients:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Secure Envelope tests
        working-directory: clients/packages/secure-envelope
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run generate:interop-vector -- "$RUNNER_TEMP/secure-envelope-vector.json"
      - name: Open TypeScript envelope in Go
        working-directory: server
        env:
          SECURE_ENVELOPE_INTEROP_VECTOR: ${{ runner.temp }}/secure-envelope-vector.json
        run: go test -count=1 -p 1 -parallel 1 ./foundation/secureenvelope
      - name: Signed manifest interoperability
        run: |
          cd server
          go run ./foundation/revealkeys/cmd/manifest-vector "$RUNNER_TEMP/reveal-key-manifest.json"
          cd ../clients/packages/secure-envelope
          npm run verify:manifest-interop -- "$RUNNER_TEMP/reveal-key-manifest.json"
      - name: Verify Cocos deterministic-randomness policy
        run: |
          test -f clients/fair-doudizhu-cocos/package.json
          test -f clients/fair-doudizhu-cocos/assets/scripts/bootstrap/GameBootstrap.ts
          ! grep -R --line-number --fixed-strings 'Math.random' \
            clients/packages/secure-envelope/src \
            clients/fair-doudizhu-cocos/assets/scripts
      - name: Admin Web build
        working-directory: clients/admin-web
        run: |
          npm install --no-audit --no-fund
          npm run build
          git diff --exit-code -- package.json src

  integration:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Verify module files
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Start MySQL 5.7 and Redis
        run: make deps-reset
      - name: Apply current schema and seed
        run: |
          make schema-apply
          make seed-apply
      - name: Complete integration suite
        run: make integration-test
      - name: Stop dependencies
        if: always()
        run: make deps-down

  runtime:
    needs: [prepare, server, clients, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Production runtime acceptance
        run: bash scripts/ci-runtime-acceptance.sh

  report:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, server, clients, integration, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SERVER: ${{ needs.server.result }}
          CLIENTS: ${{ needs.clients.result }}
          INTEGRATION: ${{ needs.integration.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          if [ "$SERVER" = success ] && [ "$CLIENTS" = success ] && [ "$INTEGRATION" = success ] && [ "$RUNTIME" = success ]; then
            state=success
            description='Goal 0029 full repository and runtime verification passed'
          else
            state=failure
            description="Goal 0029 failed: server=$SERVER clients=$CLIENTS integration=$INTEGRATION runtime=$RUNTIME"
          fi
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="$state" \
            -f context=goal0029/final-full \
            -f description="${description:0:140}" \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          test "$state" = success
