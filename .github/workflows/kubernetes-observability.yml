name: Kubernetes Observability Manifests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kubernetes-observability.yml"
      - "deploy/kubernetes/**"
      - "deploy/kubernetes-overlays/**"
      - "scripts/k8s-observability*.sh"
      - "scripts/test-k8s-observability-render.py"
      - "scripts/test-k8s-observability-server.py"
  pull_request:
    paths:
      - ".github/workflows/kubernetes-observability.yml"
      - "deploy/kubernetes/**"
      - "scripts/k8s-observability*.sh"
      - "scripts/test-k8s-observability-render.py"
      - "scripts/test-k8s-observability-server.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4
      - name: Validate bash syntax
        run: |
          bash -n scripts/k8s-observability.sh
          bash -n scripts/k8s-observability-smoke.sh
      - name: Verify Kustomize output
        run: |
          kubectl kustomize deploy/kubernetes-overlays/observability > /tmp/observability.yaml
          python3 -m pip install --user PyYAML==6.0.2
          python3 scripts/test-k8s-observability-render.py /tmp/observability.yaml
      - name: Verify server profile safety
        run: |
          kubectl kustomize deploy/kubernetes-overlays/observability-server > /tmp/server-observability.yaml
          python3 scripts/test-k8s-observability-server.py /tmp/server-observability.yaml
      - name: Verify base remains independently valid
        run: |
          kubectl kustomize deploy/kubernetes > /tmp/base.yaml
          python3 - <<'PY'
          import yaml
          docs = [x for x in yaml.safe_load_all(open("/tmp/base.yaml")) if x]
          deployments = [x for x in docs if x["kind"] == "Deployment"]
          assert len(deployments) == 1 and deployments[0]["metadata"]["name"] == "app-api"
          names = [c["name"] for c in deployments[0]["spec"]["template"]["spec"]["containers"]]
          assert names == ["app-api"], names
          PY
      - name: Start disposable Kind API server for schema admission checks
        uses: helm/kind-action@v1.14.0
        with:
          wait: 120s
      - name: Server-side dry-run admission of complete Kubernetes overlay
        run: |
          kubectl create namespace awesome-zero-platform
          kubectl apply --dry-run=server -k deploy/kubernetes-overlays/observability

