name: One-time realtime query optimization gofmt
on:
  push:
    paths:
      - .github/workflows/format-realtime-optimization-once.yml
permissions:
  contents: write
jobs:
  gofmt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Format only affected Go files
        run: |
          gofmt -w server/platform/authn/authn.go server/platform/authn/adapter/identityprovider/provider.go server/platform/identity/service.go server/platform/identity/store.go server/platform/authn/adapter/redissession/store.go server/platform/identity/realtime_authority_integration_test.go server/platform/authn/adapter/redissession/integration_test.go server/platform/authn/realtime_session_test.go
          git diff --check
          if git diff --quiet -- server/platform/authn/authn.go server/platform/authn/adapter/identityprovider/provider.go server/platform/identity/service.go server/platform/identity/store.go server/platform/authn/adapter/redissession/store.go server/platform/identity/realtime_authority_integration_test.go server/platform/authn/adapter/redissession/integration_test.go server/platform/authn/realtime_session_test.go; then
            echo "No gofmt difference"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/platform/authn/authn.go server/platform/authn/adapter/identityprovider/provider.go server/platform/identity/service.go server/platform/identity/store.go server/platform/authn/adapter/redissession/store.go server/platform/identity/realtime_authority_integration_test.go server/platform/authn/adapter/redissession/integration_test.go server/platform/authn/realtime_session_test.go
          git commit -m "style(auth): gofmt realtime query optimization"
          git push origin HEAD:main
