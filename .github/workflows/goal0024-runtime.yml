name: Goal 0024 Runtime Verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: goal0024-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    if: github.head_ref == 'goal0024-ci-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Production Compose runtime acceptance
        id: runtime-acceptance
        run: |
          set +e
          bash scripts/ci-runtime-acceptance.sh > runtime-acceptance.log 2>&1
          status=$?
          tail -n 200 runtime-acceptance.log
          exit $status
      - name: Upload runtime acceptance failure log
        if: failure() && steps.runtime-acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: goal0024-runtime-acceptance-failure-log
          path: runtime-acceptance.log
