name: One-shot Goal 0046 WX-N01 gofmt
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal0046-wx-n01-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format WX-N01 repair and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            server/business/doudizhu/application/types.go \
            server/business/doudizhu/application/service.go \
            server/apps/app-api/internal/doudizhuapi/dispatcher.go \
            server/apps/app-api/internal/doudizhuapi/dispatcher_test.go \
            server/business/doudizhu/application/service_test.go \
            server/business/doudizhu/infrastructure/mysqlstore/integration_test.go
          git add -- server
          git rm .github/workflows/goal0046-wx-n01-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): gofmt WX-N01 durable retry repair'
          git push origin HEAD:main
