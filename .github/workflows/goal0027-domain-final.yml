name: Goal 0027 Domain Final Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: goal0027-domain-final-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -d "{\"state\":\"pending\",\"context\":\"goal0027/domain-final\",\"description\":\"Final domain verification is running\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Tighten pattern validation
        run: python3 scripts/goal0027_tighten_pattern_validation.py

      - name: Format domain files
        run: gofmt -w server/business/doudizhu/domain/playing server/business/doudizhu/domain/livehand

      - name: Doudizhu domain tests
        working-directory: server
        run: go test -count=1 ./business/doudizhu/domain/...

      - name: Playing and livehand race tests
        working-directory: server
        run: go test -count=1 -race -p=1 ./business/doudizhu/domain/playing ./business/doudizhu/domain/livehand

      - name: Domain vet
        working-directory: server
        run: go vet ./business/doudizhu/domain/...

      - name: Commit verified domain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/business/doudizhu/domain/playing/pattern.go \
            server/business/doudizhu/domain/playing/pattern_value_test.go \
            server/business/doudizhu/domain/livehand/playing_concurrency_test.go
          git rm scripts/goal0027_tighten_pattern_validation.py
          git commit -m "fix: validate Doudizhu pattern structure strictly"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          sha="$(git rev-parse origin/main)"
          if [ "${{ job.status }}" = "success" ]; then
            state=success
            description="All Doudizhu domain tests, race, concurrency, and vet succeeded"
          else
            state=failure
            description="Final domain verification failed"
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -d "{\"state\":\"${state}\",\"context\":\"goal0027/domain-final\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
