name: One-shot Round 9 format
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal0046-round9-gofmt-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format Round 9 Go changes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w server/business/doudizhu/application/hand_commands.go server/business/doudizhu/domain/restore.go server/business/doudizhu/domain/room.go server/business/doudizhu/domain/room_test.go server/business/doudizhu/domain/restore_test.go server/business/doudizhu/infrastructure/runtime/durable_live_recover.go server/business/doudizhu/infrastructure/runtime/durable_live_recover_test.go server/business/doudizhu/infrastructure/runtime/live_hand_coordinator.go server/business/doudizhu/infrastructure/runtime/live_receipts.go server/business/doudizhu/infrastructure/runtime/live_receipts_test.go server/business/doudizhu/infrastructure/runtime/seed_vault.go server/business/doudizhu/infrastructure/runtime/live_terminal_receipt.go server/business/doudizhu/infrastructure/mysqlstore/live_terminal_history.go
          git add -- server
          git rm .github/workflows/goal0046-round9-gofmt-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): format Goal0046 Round9 repairs'
          git push origin HEAD:main
