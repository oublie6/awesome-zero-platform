name: Legacy Compose Observability (Manual)

# Kept to reproduce the previously verified Compose baseline only.
# Kubernetes is now the primary observability deployment and CI path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-signal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test opt-in Compose selection
        run: bash scripts/test-observability-compose.sh
      - name: Start ELK, Prometheus, Grafana and Jaeger; verify all three signals
        run: bash scripts/ci-observability-acceptance.sh
