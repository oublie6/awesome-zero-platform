name: Optional Observability Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/observability.yml"
      - "server/**"
      - "deploy/observability/**"
      - "deploy/production/**"
      - "scripts/production-compose.sh"
      - "scripts/test-observability-compose.sh"
      - "scripts/observability-smoke.sh"
      - "scripts/ci-observability-acceptance.sh"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-signal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test opt-in Compose selection
        run: bash scripts/test-observability-compose.sh
      - name: Start ELK, Prometheus, Grafana and Jaeger; verify all three signals
        run: bash scripts/ci-observability-acceptance.sh
