name: One-shot Round9 correction gofmt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal0046-round9-correction-gofmt-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w server/business/doudizhu/infrastructure/runtime/live_hand_coordinator.go server/business/doudizhu/domain/room_test.go server/business/doudizhu/domain/restore_test.go
          git add -- server
          git rm .github/workflows/goal0046-round9-correction-gofmt-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): format bounded terminal runtime correction'
          git push origin HEAD:main
