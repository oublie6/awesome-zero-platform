name: One-time websocket session Go formatting
on:
  push:
    paths:
      - .github/workflows/format-realtime-session-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Format affected realtime/session Go files
        run: |
          gofmt -w server/platform/authn/authn.go server/platform/authn/realtime_session_test.go server/platform/realtime/types.go server/platform/realtime/client.go server/platform/realtime/hub.go server/platform/realtime/http_test.go server/platform/realtime/session_lifecycle_test.go server/apps/app-api/internal/bootstrap/bootstrap.go
          git diff --check
          if git diff --quiet -- server/platform/authn/authn.go server/platform/authn/realtime_session_test.go server/platform/realtime/types.go server/platform/realtime/client.go server/platform/realtime/hub.go server/platform/realtime/http_test.go server/platform/realtime/session_lifecycle_test.go server/apps/app-api/internal/bootstrap/bootstrap.go; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/platform/authn/authn.go server/platform/authn/realtime_session_test.go server/platform/realtime/types.go server/platform/realtime/client.go server/platform/realtime/hub.go server/platform/realtime/http_test.go server/platform/realtime/session_lifecycle_test.go server/apps/app-api/internal/bootstrap/bootstrap.go
          git commit -m "style(realtime): gofmt websocket session repairs"
          git push origin HEAD:main
