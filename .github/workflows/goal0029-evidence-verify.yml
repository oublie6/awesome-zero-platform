name: Goal 0029 Evidence Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: goal0029-evidence-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Format
        run: |
          gofmt -w \
            server/business/doudizhu/domain/livehand/evidence.go \
            server/business/doudizhu/domain/livehand/evidence_test.go
      - name: Ordinary tests
        working-directory: server
        run: go test -count=1 -p 1 -parallel 1 ./business/doudizhu/domain/livehand/...
      - name: Race tests
        working-directory: server
        run: go test -race -count=1 -p 1 -parallel 1 ./business/doudizhu/domain/livehand/...
      - name: Vet
        working-directory: server
        run: go vet ./business/doudizhu/domain/livehand/...
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add server/business/doudizhu/domain/livehand/evidence.go server/business/doudizhu/domain/livehand/evidence_test.go
            git commit -m "style: format Goal 0029 final evidence"
            git push origin HEAD:main
          fi
      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=goal0029/evidence \
            -f description='Goal 0029 final evidence verification passed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=failure \
            -f context=goal0029/evidence \
            -f description='Goal 0029 final evidence verification failed' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
