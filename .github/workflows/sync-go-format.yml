name: Synchronize Go Formatting

on:
  push:
    branches: [main]
    paths:
      - server/**/*.go
      - .github/workflows/sync-go-format.yml

permissions:
  contents: write

concurrency:
  group: sync-go-format-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Format tracked Go files
        run: gofmt -w $(git ls-files 'server/**/*.go')
      - name: Commit formatting when changed
        run: |
          git add server
          if git diff --cached --quiet; then
            echo "Go files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format realtime transport"
          git push origin HEAD:main
