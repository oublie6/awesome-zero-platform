name: One-shot Goal 0046 repair gofmt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal0046-repair-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format consolidated Go changes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          find server -name '*.go' -type f -print0 | xargs -0 gofmt -w
          git add -- server
          git rm .github/workflows/goal0046-repair-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): gofmt Goal 0046 consolidated acceptance fixes'
          git push origin HEAD:main
