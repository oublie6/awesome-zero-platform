name: Goal 0028 Final Main Verification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: goal0028-final-main-verification
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Resolve latest main and publish pending status
        id: main
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main'});
            const sha = ref.data.object.sha;
            core.setOutput('sha', sha);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha,
              state: 'pending', context: 'goal0028/final-full',
              description: 'Goal 0028 final verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  server:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.prepare.outputs.sha }}"}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
      - name: Module, generated code, and formatting
        run: |
          cd server
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          cd ..
          make generate
          git diff --exit-code -- server/apps/app-api
          make fmt-check
      - name: Goal 0028 focused tests
        working-directory: server
        run: |
          go test -count=1 -p=1 -parallel=1 ./business/gamecore/... ./business/doudizhu/...
          go test -count=1 -race -p=1 -parallel=1 ./business/gamecore ./business/doudizhu/domain/playing ./business/doudizhu/domain/settlement ./business/doudizhu/domain/livehand ./business/doudizhu/application ./business/doudizhu/infrastructure/runtime
          go vet ./business/gamecore/... ./business/doudizhu/...
      - name: All Go tests and race
        run: |
          make test
          cd server
          go test -race -count=1 -p=1 -parallel=1 ./foundation/cache/... ./foundation/secureenvelope/... ./platform/identity/... ./platform/authn/... ./platform/authz/... ./platform/admin/... ./platform/realtime/...
      - name: Build and Compose validation
        run: |
          make build
          docker compose -f deploy/local/docker-compose.yml config >/dev/null
          bash scripts/test-production-compose.sh
          APP_MYSQL_PASSWORD=ci-mysql-password APP_MYSQL_ROOT_PASSWORD=ci-mysql-root-password APP_REDIS_PASSWORD=ci-redis-password APP_AUTH_ACCESS_TOKEN_SECRET=ci-access-token-secret-0123456789abcdef APP_ADMIN_BOOTSTRAP_TOKEN=ci-admin-bootstrap-token-0123456789abcdef APP_HTTPS_ENABLED=false bash scripts/production-compose.sh config >/dev/null
          touch "$RUNNER_TEMP/ci-tls.crt" "$RUNNER_TEMP/ci-tls.key"
          APP_MYSQL_PASSWORD=ci-mysql-password APP_MYSQL_ROOT_PASSWORD=ci-mysql-root-password APP_REDIS_PASSWORD=ci-redis-password APP_AUTH_ACCESS_TOKEN_SECRET=ci-access-token-secret-0123456789abcdef APP_ADMIN_BOOTSTRAP_TOKEN=ci-admin-bootstrap-token-0123456789abcdef APP_HTTPS_ENABLED=true APP_TLS_CERT_FILE="$RUNNER_TEMP/ci-tls.crt" APP_TLS_KEY_FILE="$RUNNER_TEMP/ci-tls.key" bash scripts/production-compose.sh config >/dev/null

  clients:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.prepare.outputs.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Secure Envelope and signed manifest
        run: |
          cd clients/packages/secure-envelope
          npm install --no-audit --no-fund
          npm test
          npm run generate:interop-vector -- "$RUNNER_TEMP/secure-envelope-vector.json"
          cd ../../../server
          SECURE_ENVELOPE_INTEROP_VECTOR="$RUNNER_TEMP/secure-envelope-vector.json" go test -count=1 -p=1 -parallel=1 ./foundation/secureenvelope
          go run ./foundation/revealkeys/cmd/manifest-vector "$RUNNER_TEMP/reveal-key-manifest.json"
          cd ../clients/packages/secure-envelope
          npm run verify:manifest-interop -- "$RUNNER_TEMP/reveal-key-manifest.json"
      - name: Cocos policy and Admin Web
        run: |
          test -f clients/fair-doudizhu-cocos/package.json
          ! grep -R --line-number --fixed-strings 'Math.random' clients/packages/secure-envelope/src clients/fair-doudizhu-cocos/assets/scripts
          cd clients/admin-web
          npm install --no-audit --no-fund
          npm run build
          git diff --exit-code -- package.json src

  integration:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.prepare.outputs.sha }}"}
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.8
          cache-dependency-path: server/go.sum
      - name: Module files
        working-directory: server
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Full MySQL and Redis integration
        run: |
          make deps-reset
          make schema-apply
          make seed-apply
          make integration-test
      - name: Stop dependencies
        if: always()
        run: make deps-down

  runtime:
    if: needs.server.result == 'success' && needs.clients.result == 'success' && needs.integration.result == 'success'
    needs: [prepare, server, clients, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.prepare.outputs.sha }}"}
      - name: Production runtime acceptance
        run: bash scripts/ci-runtime-acceptance.sh

  report:
    if: always()
    needs: [prepare, server, clients, integration, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final status
        uses: actions/github-script@v7
        env:
          MAIN_SHA: ${{ needs.prepare.outputs.sha }}
          SERVER_RESULT: ${{ needs.server.result }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        with:
          script: |
            const results = {server: process.env.SERVER_RESULT, clients: process.env.CLIENTS_RESULT, integration: process.env.INTEGRATION_RESULT, runtime: process.env.RUNTIME_RESULT};
            const success = Object.values(results).every(v => v === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.MAIN_SHA,
              state: success ? 'success' : 'failure', context: 'goal0028/final-full',
              description: success ? 'Goal 0028 full repository and production runtime passed' : `Goal 0028 failed: ${JSON.stringify(results)}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
