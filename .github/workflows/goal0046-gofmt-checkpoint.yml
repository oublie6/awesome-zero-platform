name: Goal 0046 Temporary Go Format
on:
  push:
    paths:
      - '.github/workflows/goal0046-gofmt-checkpoint.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Format all Go source files
        shell: bash
        run: |
          set -euo pipefail
          find server -name '*.go' -type f -print0 | xargs -0 gofmt -w
          if git diff --quiet -- server; then
            echo 'No Go formatting changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server
          git commit -m 'style(go): format signed fairness AAD and projection implementation'
          git push origin HEAD:main
