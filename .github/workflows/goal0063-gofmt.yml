name: Goal0063 one-time Go source formatting
on:
  push:
    branches:
      - goal0063-dq-turn-experience
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'oublie6/awesome-zero-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: goal0063-dq-turn-experience
          persist-credentials: true
      - name: Format only changed Goal0063 Go source and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w server/apps/app-api/internal/bootstrap/doudizhu.go             server/apps/app-api/internal/bootstrap/doudizhu_turn_clock.go             server/apps/app-api/internal/bootstrap/doudizhu_turn_dq.go             server/apps/app-api/internal/bootstrap/doudizhu_turn_dq_test.go             server/apps/app-api/internal/config/config.go             server/apps/app-api/internal/config/environment.go             server/apps/app-api/internal/config/validate.go             server/apps/app-api/internal/doudizhuapi/dispatcher.go             server/apps/app-api/internal/doudizhuapi/realtime.go             server/business/doudizhu/application/turntimer/ticket.go             server/business/doudizhu/application/turntimer/ticket_test.go             server/business/doudizhu/infrastructure/mysqlstore/live_journal.go             server/business/doudizhu/infrastructure/mysqlstore/live_turn_deadline.go             server/business/doudizhu/infrastructure/runtime/live_hand_coordinator.go             server/platform/delayqueue/dq.go             server/platform/delayqueue/dq_test.go
          git rm -- .github/workflows/goal0063-gofmt.yml
          git add -u server
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(goal0063): apply canonical gofmt to turn scheduler'
          git push origin HEAD:goal0063-dq-turn-experience
