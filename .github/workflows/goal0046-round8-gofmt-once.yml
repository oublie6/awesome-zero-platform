name: One-shot Round 8 repairs gofmt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goal0046-round8-gofmt-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format Go files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            server/business/doudizhu/application/lifecycle/supervisor.go \
            server/business/doudizhu/application/lifecycle/supervisor_test.go \
            server/business/doudizhu/application/hand_commands.go \
            server/business/doudizhu/application/errors.go \
            server/business/doudizhu/infrastructure/mysqlstore/transaction.go \
            server/business/doudizhu/domain/room.go \
            server/business/doudizhu/domain/restore.go \
            server/business/doudizhu/application/room_queries.go \
            server/business/doudizhu/domain/room_test.go
          git add -- server
          git rm .github/workflows/goal0046-round8-gofmt-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(go): gofmt Round 8 lifecycle and client repair'
          git push origin HEAD:main
